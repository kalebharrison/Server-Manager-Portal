name: Container smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build container
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t server-manager-portal:smoke .

      - name: Check production dependencies
        run: |
          docker run --rm --entrypoint node server-manager-portal:smoke -e "\
            require.resolve('express'); \
            try { require.resolve('react'); process.exit(1); } \
            catch { process.exit(0); }"

      - name: Start container
        run: |
          mkdir -p /tmp/server-manager-portal-smoke/config /tmp/server-manager-portal-smoke/backup
          docker run -d --name server-manager-portal-smoke \
            -p 2121:2121 \
            -e JWT_SECRET=smoke-test-secret-smoke-test-secret-123456 \
            -e CONFIG_DIR=/app/config \
            -v /tmp/server-manager-portal-smoke/config:/app/config \
            -v /tmp/server-manager-portal-smoke/backup:/app/backup \
            server-manager-portal:smoke

      - name: Smoke test endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2121/api/config/public >/tmp/public.json; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:2121/api/config/public
          curl -fsS http://127.0.0.1:2121/api/health
          curl -fsS http://127.0.0.1:2121/ >/tmp/index.html
          curl -fsS http://127.0.0.1:2121/static/tailwind.css >/tmp/tailwind.css

          chunk="$(docker exec server-manager-portal-smoke sh -lc 'ls /app/static/chunks/*.js | head -n 1 | xargs -n1 basename')"
          test -n "$chunk"
          curl -fsSI http://127.0.0.1:2121/ | tr -d '\r' | grep -qi 'cache-control: no-store'
          curl -fsSI http://127.0.0.1:2121/static/bundle.js | tr -d '\r' | grep -qi 'cache-control: public, max-age=300, must-revalidate'
          curl -fsSI "http://127.0.0.1:2121/static/chunks/$chunk" | tr -d '\r' | grep -qi 'cache-control: public, max-age=31536000, immutable'

      - name: Show container logs on failure
        if: failure()
        run: docker logs server-manager-portal-smoke || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f server-manager-portal-smoke || true
          rm -rf /tmp/server-manager-portal-smoke
